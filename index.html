<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de fincas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14634F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fincas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icono2-192.png">
<link rel="apple-touch-icon" href="icono2-180.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#EEF1EA; --surface:#FFFFFF; --ink:#17261E; --muted:#5E6F64; --line:#D5DDD3;
  --accent:#14634F; --accent-ink:#FFFFFF; --stock:#A85F00; --danger:#B3261E; --soft:#E3EBE2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101814; --surface:#19241E; --ink:#E6EEE8; --muted:#93A598; --line:#2A3A31;
    --accent:#4FC3A1; --accent-ink:#08140F; --stock:#F0B048; --danger:#FF8A80; --soft:#22312A;
  }
}
:root[data-theme="dark"]{
  --bg:#101814; --surface:#19241E; --ink:#E6EEE8; --muted:#93A598; --line:#2A3A31;
  --accent:#4FC3A1; --accent-ink:#08140F; --stock:#F0B048; --danger:#FF8A80; --soft:#22312A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0;font-weight:600;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:720px;margin:0 auto;padding:12px 14px 96px}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.obs{font-size:13.5px;color:var(--ink);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;white-space:pre-wrap}
.obs b{color:var(--muted);font-weight:500}
.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:-2px 0 10px}
.status span{flex:1}
.status .iconbtn{min-height:32px;font-size:13px;padding:0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
.top h1{font-size:26px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:40px;min-width:40px;padding:0 12px;font-weight:500}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;min-height:46px;padding:0 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.spacer{flex:1}

select.camp{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px;font-weight:500;max-width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px}
.fcard{display:block;width:100%;text-align:left}
.fcard .nm{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600;line-height:1.1}
.fcard .vr{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600;line-height:1.1}
.stat.stk .v{color:var(--stock)}

.head{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;margin:0 0 12px}
.head .nm{font-size:30px;line-height:1.05}
.head .vr{opacity:.85;font-size:15px}
.head .kg{font-family:'Barlow Condensed',sans-serif;font-size:54px;font-weight:700;line-height:1;margin-top:10px}
.head .kg small{font-size:20px;font-weight:500;opacity:.85;margin-left:4px}
.head .l{font-size:12px;opacity:.85}
.head .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;border-top:1px solid rgba(255,255,255,.28);padding-top:10px}
.head .two .v{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:600;line-height:1.1}
:root[data-theme="dark"] .head .two{border-top-color:rgba(0,0,0,.25)}

.rec{width:100%;text-align:left;display:block}
.rec .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rec .dt{font-weight:600}
.rec .mt{color:var(--muted);font-size:14px;letter-spacing:.04em}
.rec .neto{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;line-height:1}
.rec .neto small{font-size:14px;font-weight:500;color:var(--muted)}
.rec .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;margin-top:10px;font-size:13px}
.rec .grid div span{display:block;color:var(--muted);font-size:11.5px}
.rec .grid b{font-weight:600}
.rec .stk b{color:var(--stock)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.sec h2{font-size:22px}

.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-size:13px;color:var(--muted);font-weight:500;background:var(--soft)}
tfoot td{font-weight:700;border-bottom:0;background:var(--soft)}
td.k{font-weight:600}
td.s{color:var(--stock);font-weight:600}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;background:transparent;min-height:56px;font-weight:600;color:var(--muted);font-size:13px;line-height:1.15;padding:0 2px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;margin-right:12px}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-size:11px;font-weight:600;background:var(--soft);color:var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:26px;margin-bottom:10px}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}
.fld textarea{min-height:120px;font-size:13px;font-family:ui-monospace,monospace}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;margin:8px 0 6px;color:var(--accent)}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px;margin:6px 0 14px}
.prev .l{font-size:12px;color:var(--muted)}
.prev .v{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.prev .st .v{color:var(--stock)}
.plates{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px}
.chip button{border:0;background:transparent;font-size:18px;line-height:1;color:var(--muted);min-width:28px;min-height:28px}
.note{color:var(--muted);font-size:13px;margin:6px 0 10px}
.warn{background:var(--soft);border-left:4px solid var(--stock);padding:8px 12px;border-radius:8px;font-size:14px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="title">Control de fincas</h1>
    <div class="row"><button class="iconbtn" data-act="excel">Excel</button><button class="iconbtn" data-act="settings" aria-label="Ajustes">Ajustes</button></div>
  </div>
  <div class="status"><span id="status">Datos en este móvil</span><button class="iconbtn" data-act="pick-xlsx">Importar Excel</button></div>
  <div id="warn"></div>
  <div id="bk"></div>
  <main id="app"></main>
</div>
<nav class="tabs" aria-label="Secciones">
  <button data-act="tab-home" id="tabHome">Fincas</button>
  <button data-act="tab-done" id="tabDone">Recolectadas</button>
  <button data-act="tab-kilos" id="tabKilos">Resumen kilos</button>
  <button data-act="tab-envases" id="tabEnvases">Resumen envases</button>
</nav>
<div id="layer"></div>
<input type="file" id="xlsxIn" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none">

<script>
(function(){
const KEY='control-fincas-v1';
const PESO_CAJA=2.5, PESO_PALET=25;
let S=null, V={name:'home',id:null}, storageOK=true, delArm=false;
let F={variedad:'',patron:'',modo:'todo'};
let SEL={on:false,ids:{}};

/* ---------- utilidades ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:0};
const fmt=(x,d=0)=>(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toLocaleString('es-ES',{maximumFractionDigits:d,useGrouping:'always'});
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const showDate=s=>{const p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s};
function defaultCampaignName(){const d=new Date();const y=d.getMonth()>=6?d.getFullYear():d.getFullYear()-1;return 'Campaña '+y+'/'+String(y+1).slice(2)}

/* ---------- datos ---------- */
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!Array.isArray(S.campaigns)) S={campaigns:[],plates:[],current:null};
  if(!Array.isArray(S.plates)) S.plates=[];
  if(!Array.isArray(S.varieties)) S.varieties=[];
  if(!S.campaigns.length){const c={id:uid(),name:defaultCampaignName(),fincas:[]};S.campaigns.push(c);S.current=c.id}
  if(!S.campaigns.find(c=>c.id===S.current)) S.current=S.campaigns[0].id;
}
/* ---------- guardado local ---------- */
const hhmm=()=>new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
function setStatus(t){const el=$('status');if(el)el.textContent=t}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;setStatus('Guardado en este móvil · '+hhmm())}
  catch(e){storageOK=false;setStatus('No se pudo guardar')}
  $('warn').innerHTML=storageOK?'':'<div class="warn">Este navegador no permite guardar datos. Haz una copia desde Ajustes para no perderlos.</div>';
}

/* ---------- exportar a Excel ---------- */
/* ---------- PDF ---------- */
async function shareFile(blob,name,mime){
  try{
    const file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
}
const safeName=t=>String(t).replace(/[\\/:*?"<>|]/g,'-');
function pdfLib(){
  if(window.jspdf&&window.jspdf.jsPDF&&typeof window.jspdf.jsPDF.API.autoTable==='function')return window.jspdf.jsPDF;
  setStatus('El generador de PDF no se ha cargado. Conecta a internet una vez y reintenta.');
  return null;
}
function pageNumbers(doc){
  const n=doc.getNumberOfPages(), w=doc.internal.pageSize.getWidth(), h=doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(9);doc.setTextColor(120);doc.text('Página '+i+' de '+n,w-14,h-8,{align:'right'})}
}
const HEAD={fillColor:[20,99,79],textColor:255};
const FOOT={fillColor:[227,235,226],textColor:20,fontStyle:'bold'};

async function pdfSummary(){
  const J=pdfLib();if(!J)return;
  const c=camp(), list=filtered();
  if(!list.length){setStatus('No hay datos con este filtro');return}
  const doc=new J({unit:'mm',format:'a4'});
  const fl=[];
  if(F.patron.trim())fl.push('Finca: '+F.patron.trim());
  if(F.variedad){fl.push('Variedad: '+(varietyList()[F.variedad]||F.variedad))}
  doc.setTextColor(20);doc.setFontSize(18);doc.text('Resumen de fincas',14,18);
  doc.setFontSize(11);doc.text(c.name+' - '+showDate(today()),14,25);
  doc.setTextColor(90);doc.text(fl.length?fl.join('     '):'Todas las fincas y variedades',14,31);
  doc.setTextColor(20);
  const T={kg:0,c:0,p:0,n:0};
  const data=list.map(function(f){const t=totals(f);T.kg+=t.kg;T.c+=t.c;T.p+=t.p;T.n+=f.records.length;return {f:f,t:t}});
  let y=38;
  if(F.modo!=='envases'){
    doc.setFontSize(13);doc.text('Kilos',14,y+2);
    doc.autoTable({startY:y+5,margin:{left:14,right:14},styles:{fontSize:10},headStyles:HEAD,footStyles:FOOT,
      head:[['Finca','Variedad','Registros','Kilos totales']],
      body:data.map(d=>[d.f.name,d.f.variety||'',String(d.f.records.length),fmt(d.t.kg,1)]),
      foot:[['Total','',String(T.n),fmt(T.kg,1)]],
      columnStyles:{2:{halign:'right'},3:{halign:'right'}}});
    y=doc.lastAutoTable.finalY+10;
  }
  if(F.modo!=='kilos'){
    if(y>235){doc.addPage();y=20}
    doc.setFontSize(13);doc.text('Envases',14,y+2);
    doc.autoTable({startY:y+5,margin:{left:14,right:14},styles:{fontSize:10},headStyles:HEAD,footStyles:FOOT,
      head:[['Finca','Variedad','Stock cajas','Stock palet']],
      body:data.map(d=>[d.f.name,d.f.variety||'',fmt(d.t.c),fmt(d.t.p)]),
      foot:[['Total','',fmt(T.c),fmt(T.p)]],
      columnStyles:{2:{halign:'right'},3:{halign:'right'}}});
  }
  pageNumbers(doc);
  const tag=(F.modo==='kilos'?' kilos':F.modo==='envases'?' envases':'')+(fl.length?' '+fl.join(' ').replace(/(Finca|Variedad): /g,''):'');
  await shareFile(doc.output('blob'),safeName('Resumen '+c.name+tag+' '+today())+'.pdf','application/pdf');
  setStatus('PDF generado · '+hhmm());
}

function fincaPage(doc,f){
  const t=totals(f);
  doc.setTextColor(20);doc.setFontSize(18);doc.text(f.name,14,16);
  doc.setFontSize(11);doc.text((f.owner?'Propietario: '+f.owner+'  -  ':'')+(f.variety||'Sin variedad')+'  -  '+camp().name+'  -  '+(f.done?'Recolectada el '+showDate(f.doneDate):'En curso'),14,23);
  doc.text('Kilos totales: '+fmt(t.kg,1)+'     Stock cajas: '+fmt(t.c)+'     Stock palet: '+fmt(t.p),14,30);
  const recs=f.records.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||(a.ts||0)-(b.ts||0));
  doc.autoTable({startY:35,margin:{left:10,right:10},styles:{fontSize:8,cellPadding:1.6,valign:'top'},headStyles:HEAD,footStyles:FOOT,
    head:[['Fecha','Matrícula','Cajas ent.','Palet ent.','Tara','Bruto','Cajas sal.','Palet sal.','Stock cajas','Stock palet','Neto kg','Observaciones']],
    body:recs.map(r=>[showDate(r.fecha),r.mat||'',fmt(num(r.ce)),fmt(num(r.pe)),fmt(num(r.tara),1),fmt(num(r.bruto),1),fmt(num(r.cs)),fmt(num(r.ps)),fmt(stockC(r)),fmt(stockP(r)),fmt(neto(r),1),r.obs||'']),
    foot:[['Total','','','','','','','',fmt(t.c),fmt(t.p),fmt(t.kg,1),'']],
    columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'},8:{halign:'right'},9:{halign:'right'},10:{halign:'right'},11:{cellWidth:60}}});
}
async function pdfFinca(){
  const J=pdfLib();if(!J)return;
  const f=finca(V.id);if(!f)return;
  const doc=new J({unit:'mm',format:'a4',orientation:'landscape'});
  fincaPage(doc,f);
  pageNumbers(doc);
  await shareFile(doc.output('blob'),safeName('Finca '+f.name+' '+today())+'.pdf','application/pdf');
  setStatus('PDF generado · '+hhmm());
}
async function pdfFincas(list,detail){
  const J=pdfLib();if(!J)return;
  if(!list.length){setStatus('No hay fincas seleccionadas');return}
  const doc=new J({unit:'mm',format:'a4',orientation:'landscape'});
  const T={kg:0,c:0,p:0};
  const body=list.map(function(f){const t=totals(f);T.kg+=t.kg;T.c+=t.c;T.p+=t.p;return [f.name,f.owner||'',f.variety||'',f.done?showDate(f.doneDate):'En curso',fmt(t.kg,1),fmt(t.c),fmt(t.p)]});
  doc.setTextColor(20);doc.setFontSize(18);doc.text('Listado de fincas',14,16);
  doc.setFontSize(11);doc.text(camp().name+'  -  '+showDate(today())+'  -  '+list.length+(list.length===1?' finca':' fincas'),14,23);
  doc.autoTable({startY:29,margin:{left:14,right:14},styles:{fontSize:10},headStyles:HEAD,footStyles:FOOT,
    head:[['Finca','Propietario','Variedad','Fin recolección','Kilos totales','Stock cajas','Stock palet']],
    body:body,foot:[['Total','','','',fmt(T.kg,1),fmt(T.c),fmt(T.p)]],
    columnStyles:{4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}}});
  if(detail){list.forEach(function(f){doc.addPage();fincaPage(doc,f)})}
  pageNumbers(doc);
  await shareFile(doc.output('blob'),safeName('Fincas ('+list.length+') '+today())+'.pdf','application/pdf');
  setStatus('PDF generado · '+hhmm());
}

/* ---------- copia de seguridad en Excel ---------- */
const BACKUP_DIAS=1;
function daysSince(iso){
  const a=new Date(iso+'T00:00:00'), b=new Date(today()+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function backupBanner(){
  const el=$('bk');if(!el)return;
  const hasData=S.campaigns.some(c=>c.fincas.some(f=>f.records.length));
  if(!hasData){el.innerHTML='';return}
  const d=S.lastBackup?daysSince(S.lastBackup):null;
  if(d!==null&&d<BACKUP_DIAS){el.innerHTML='';return}
  el.innerHTML='<div class="warn"><b>Copia de seguridad.</b> '+
    (d===null?'Todavía no has hecho ninguna copia en Excel.':d===1?'La última copia en Excel fue ayer. Haz la de hoy.':'Hace '+d+' días de tu última copia en Excel.')+
    '<button class="iconbtn" style="min-height:36px;margin-top:8px;display:block" data-act="excel">Hacer copia ahora</button></div>';
}
function startupReminder(){
  const hasData=S.campaigns.some(c=>c.fincas.some(f=>f.records.length));
  if(!hasData||S.lastBackup===today()||S.lastPrompt===today())return;
  S.lastPrompt=today();save();
  openSheet('<h2>Copia de seguridad de hoy</h2>'+
    '<div class="note" style="color:var(--ink);font-size:15px">'+(S.lastBackup?'Tu última copia en Excel es del '+showDate(S.lastBackup)+'.':'Todavía no has hecho ninguna copia en Excel.')+' Guárdala ahora para no perder datos.</div>'+
    '<div class="row wrap2"><button class="btn" data-act="excel-reminder">Hacer copia ahora</button><button class="btn ghost" data-act="close">Más tarde</button></div>');

async function exportXlsx(){
  if(!window.XLSX){setStatus('El generador de Excel no se ha cargado. Conecta a internet una vez y reintenta.');return}
  const c=camp(), r2=x=>Math.round(x*100)/100;
  const res=[['Finca','Variedad','Kilos totales','Stock cajas','Stock palet']];
  const T={kg:0,c:0,p:0};
  c.fincas.forEach(function(f){const t=totals(f);T.kg+=t.kg;T.c+=t.c;T.p+=t.p;res.push([f.name,f.variety||'',r2(t.kg),t.c,t.p])});
  res.push(['Total '+c.name,'',r2(T.kg),T.c,T.p]);
  const fin=[['Campaña','Finca','Variedad','Propietario','Estado','Fecha fin']];
  const reg=[['Campaña','Finca','Variedad','Propietario','Fecha','Matrícula','Cajas entrada','Palet entrada','Tara','Bruto','Cajas salida','Palet salida','Stock cajas','Stock palet','Peso neto kg','Observaciones']];
  S.campaigns.forEach(function(cp){
    cp.fincas.forEach(function(f){
      fin.push([cp.name,f.name,f.variety||'',f.owner||'',f.done?'Recolectada':'En curso',f.done?showDate(f.doneDate):'']);
      f.records.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||(a.ts||0)-(b.ts||0)).forEach(function(r){
        reg.push([cp.name,f.name,f.variety||'',f.owner||'',showDate(r.fecha),r.mat||'',num(r.ce),num(r.pe),num(r.tara),num(r.bruto),num(r.cs),num(r.ps),stockC(r),stockP(r),r2(neto(r)),r.obs||'']);
      });
    });
  });
  const wb=XLSX.utils.book_new();
  const w1=XLSX.utils.aoa_to_sheet(res);w1['!cols']=[{wch:22},{wch:18},{wch:15},{wch:13},{wch:13}];
  const w2=XLSX.utils.aoa_to_sheet(fin);w2['!cols']=[{wch:20},{wch:22},{wch:18},{wch:22},{wch:13},{wch:12}];
  const w3=XLSX.utils.aoa_to_sheet(reg);w3['!cols']=[{wch:20},{wch:20},{wch:16},{wch:22},{wch:12},{wch:12},{wch:13},{wch:13},{wch:10},{wch:10},{wch:12},{wch:12},{wch:12},{wch:12},{wch:14},{wch:34}];
  XLSX.utils.book_append_sheet(wb,w1,'Resumen');
  XLSX.utils.book_append_sheet(wb,w2,'Fincas');
  XLSX.utils.book_append_sheet(wb,w3,'Registros');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const name=safeName('Control fincas copia '+today())+'.xlsx';
  const mime='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob=new Blob([buf],{type:mime});
  try{
    const file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      markBackup();setStatus('Copia en Excel guardada · '+hhmm());return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
  markBackup();setStatus('Copia en Excel descargada · '+hhmm());
}

function parseDate(v){
  if(typeof v==='number'&&isFinite(v)){return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10)}
  v=String(v==null?'':v).trim();
  let m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  return today();
}
function buildFromRows(rowsF,rowsR){
  const camps=[], cmap={}, fmap={};
  let n=0;
  function getCamp(name){
    name=String(name==null?'':name).trim()||defaultCampaignName();
    let c=cmap[name];if(!c){c={id:uid(),name:name,fincas:[]};cmap[name]=c;camps.push(c)}
    return c;
  }
  function getFinca(cn,fn,variety,owner){
    const c=getCamp(cn);fn=String(fn==null?'':fn).trim();if(!fn)return null;
    const k=c.id+'|'+fn.toLowerCase();let f=fmap[k];
    if(!f){f={id:uid(),name:fn,owner:'',variety:String(variety==null?'':variety).trim(),ord:Date.now()+(n++),records:[]};fmap[k]=f;c.fincas.push(f)}
    if(!f.owner&&owner!=null&&String(owner).trim())f.owner=String(owner).trim();
    return f;
  }
  rowsF.forEach(function(r){
    const f=getFinca(r['Campaña'],r['Finca'],r['Variedad'],r['Propietario']);if(!f)return;
    if(String(r['Estado']||'').toLowerCase().indexOf('recolect')===0){f.done=true;f.doneDate=parseDate(r['Fecha fin'])}
  });
  let nrec=0;const plates={};
  rowsR.forEach(function(r,i){
    const f=getFinca(r['Campaña'],r['Finca'],r['Variedad'],r['Propietario']);if(!f)return;
    const rec={id:uid(),ts:Date.now()+i,fecha:parseDate(r['Fecha']),mat:String(r['Matrícula']==null?'':r['Matrícula']).trim().toUpperCase(),
      ce:num(r['Cajas entrada']),pe:num(r['Palet entrada']),tara:num(r['Tara']),bruto:num(r['Bruto']),
      cs:num(r['Cajas salida']),ps:num(r['Palet salida']),obs:String(r['Observaciones']==null?'':r['Observaciones']).trim()};
    f.records.push(rec);nrec++;if(rec.mat)plates[rec.mat]=1;
  });
  return {camps:camps,plates:Object.keys(plates),nrec:nrec};
}
let pendingImport=null;
async function importFile(file){
  if(!file)return;
  if(!window.XLSX){openSheet('<h2>Restaurar desde Excel</h2><div class="warn">El lector de Excel no se ha cargado. Conecta a internet una vez, ábrela de nuevo y reintenta.</div><button class="btn block" data-act="close">Cerrar</button>');return}
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    if(!wb.Sheets['Fincas']||!wb.Sheets['Registros'])throw new Error('formato');
    const rowsF=XLSX.utils.sheet_to_json(wb.Sheets['Fincas'],{defval:''});
    const rowsR=XLSX.utils.sheet_to_json(wb.Sheets['Registros'],{defval:''});
    const out=buildFromRows(rowsF,rowsR);
    if(!out.camps.length)throw new Error('vacio');
    pendingImport=out;
    const nf=out.camps.reduce((a,c)=>a+c.fincas.length,0);
    openSheet('<h2>Restaurar desde Excel</h2>'+
      '<div class="note" style="color:var(--ink);font-size:15px">Se han encontrado <b>'+out.camps.length+'</b> campaña(s), <b>'+nf+'</b> fincas y <b>'+out.nrec+'</b> registros.</div>'+
      '<div class="warn">Esto sustituye todos los datos actuales de la app. Si no estás seguro, cancela y haz antes una copia.</div>'+
      '<div class="row wrap2"><button class="btn" data-act="import-ok">Reemplazar datos</button><button class="btn ghost" data-act="close">Cancelar</button></div>');
  }catch(e){
    openSheet('<h2>Restaurar desde Excel</h2><div class="warn">Este archivo no parece una copia de seguridad de la app. Usa un Excel generado con el botón «Excel».</div><button class="btn block" data-act="close">Cerrar</button>');
  }
}
function applyImport(){
  const o=pendingImport;if(!o)return;
  S.campaigns=o.camps;S.current=o.camps[o.camps.length-1].id;
  S.plates=Array.from(new Set(S.plates.concat(o.plates))).sort();
  o.camps.forEach(c=>c.fincas.forEach(f=>{if(f.variety)registerVariety(f.variety,'otra')}));
  pendingImport=null;

/* ---------- cálculos ---------- */
function neto(r){
  const bruto=num(r.bruto);
  if(bruto===0) return 0;
  const envSal=num(r.cs)*PESO_CAJA+num(r.ps)*PESO_PALET;
  const envEnt=num(r.ce)*PESO_CAJA+num(r.pe)*PESO_PALET;
  return (bruto-envSal)-(num(r.tara)-envEnt);
}
const stockC=r=>num(r.ce)-num(r.cs);
const stockP=r=>num(r.pe)-num(r.ps);
function totals(f){
  return f.records.reduce((t,r)=>{t.kg+=neto(r);t.c+=stockC(r);t.p+=stockP(r);return t},{kg:0,c:0,p:0});
}

/* ---------- variedades ---------- */
const VAR_NARANJA=['Barberina','Cambria','Cara Cara','Chislett','Fukumoto','Lane Late','Midknight','Navel Foyos','Navelate','Navelina','Newhall','Powell','Salustiana','Sanguinelli','Tarocco','Thomson','Valencia Late','Washington Navel'];
const VAR_MANDARINA=['Arrufatina','Basol','Clemenrubí','Clemensoon','Clemenules','Esbal','Fina','Fortune','Hernandina','Loretina','Marisol','Murcott','Nadorcott','Nova','Okitsu','Orogrande','Oronules','Oroval','Orri','Ortanique','Safor','Satsuma Owari','Tango','Tardivo'];
const normA=x=>String(x==null?'':x).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const byEs=(a,b)=>a.localeCompare(b,'es');
function varietyGroups(){
  const g={n:VAR_NARANJA.slice(),m:VAR_MANDARINA.slice(),o:[]};
  const known={};
  g.n.concat(g.m).forEach(v=>{known[normA(v)]=1});
  (S.varieties||[]).forEach(function(v){
    const k=normA(v.n);if(!k||known[k])return;known[k]=1;
    (v.t==='naranja'?g.n:v.t==='mandarina'?g.m:g.o).push(v.n);
  });
  S.campaigns.forEach(c=>c.fincas.forEach(function(f){
    const k=normA(f.variety);if(k&&!known[k]){known[k]=1;g.o.push(String(f.variety).trim())}
  }));
  g.n.sort(byEs);g.m.sort(byEs);g.o.sort(byEs);
  return g;
}
function canonicalVariety(name){
  const k=normA(name), g=varietyGroups(), all=g.n.concat(g.m,g.o);
  for(let i=0;i<all.length;i++){if(normA(all[i])===k)return all[i]}
  return String(name).trim();
}
function registerVariety(name,tipo){
  const k=normA(name);
  if(VAR_NARANJA.concat(VAR_MANDARINA).some(v=>normA(v)===k))return;
  if(S.varieties.some(v=>normA(v.n)===k))return;
  S.varieties.push({n:name,t:tipo||'otra'});
}

const normV=v=>String(v||'').trim().toLowerCase();
function varietyList(){
  const m={};
  camp().fincas.forEach(function(f){const k=normV(f.variety);if(k&&!m[k])m[k]=String(f.variety).trim()});
  return m;
}
function matchPattern(name,pat){
  pat=String(pat||'').trim();
  if(!pat) return true;
  const norm=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const n=norm(name), p=norm(pat);
  if(p.indexOf('*')<0) return n.indexOf(p)>=0;
  const re=new RegExp('^'+p.split('*').map(x=>x.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$');
  return re.test(n);
}
function filtered(){
  return camp().fincas.filter(f=>(!F.variedad||normV(f.variety)===F.variedad)&&matchPattern(f.name,F.patron));
}

    '<label class="fld"><span>Finca (usa * como comodín)</span><input id="lPat" value="'+esc(F.patron)+'" placeholder="Ej.: C-*Bio   o   *Bio" autocomplete="off" autocapitalize="none" autocorrect="off"></label>'+
    '<label class="fld"><span>Contenido</span><select id="lModo">'+
      [['todo','Kilos y envases (por separado)'],['kilos','Solo kilos'],['envases','Solo envases']].map(o=>'<option value="'+o[0]+'"'+(o[0]===F.modo?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>'+
    '<div class="note">Sin asterisco busca el texto dentro del nombre. «C-*Bio» = empieza por C- y acaba en Bio. «*Bio» = acaba en Bio.</div>'+
    '<div class="note" id="lCount" style="color:var(--ink)"></div>'+
    '<div class="row wrap2"><button class="btn" data-act="do-pdf-summary">Generar PDF</button><button class="btn ghost" data-act="close">Cancelar</button></div>');
  updateListing();
}
function readListing(){F.variedad=$('lVar').value;F.patron=$('lPat').value;F.modo=$('lModo').value}
function updateListing(){
  if(!$('lVar'))return;
  readListing();
  const l=filtered(), el=$('lCount');
  if(!l.length){el.textContent='Ninguna finca coincide con el filtro.';return}
  const names=l.slice(0,12).map(f=>esc(f.name)).join(', ')+(l.length>12?'…':'');
  el.innerHTML='<b>'+l.length+(l.length>1?' fincas':' finca')+':</b> '+names;
}

/* ---------- hojas (formularios) ---------- */
function openSheet(html){
  $('layer').innerHTML='<div class="shade" data-act="shade"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
}
function closeSheet(){$('layer').innerHTML='';delArm=false}

function varietyOptions(cur){
  const g=varietyGroups(), k=normA(cur);
  const opt=v=>'<option value="'+esc(v)+'"'+(k&&normA(v)===k?' selected':'')+'>'+esc(v)+'</option>';
  let h='<option value=""'+(k?'':' selected')+'>- Sin variedad -</option>';
  h+='<optgroup label="Naranjas">'+g.n.map(opt).join('')+'</optgroup>';
  h+='<optgroup label="Mandarinas">'+g.m.map(opt).join('')+'</optgroup>';
  if(g.o.length)h+='<optgroup label="Otras">'+g.o.map(opt).join('')+'</optgroup>';
  h+='<option value="__new__">+ Añadir variedad nueva...</option>';
  return h;
}
function fincaForm(f){
  openSheet('<h2>'+(f?'Editar finca':'Nueva finca')+'</h2>'+
    '<label class="fld"><span>Finca</span><input id="fName" value="'+esc(f?f.name:'')+'" autocomplete="off"></label>'+
    '<label class="fld"><span>Propietario</span><input id="fOwner" value="'+esc(f&&f.owner?f.owner:'')+'" autocomplete="off"></label>'+
    '<label class="fld"><span>Variedad</span><select id="fVarSel">'+varietyOptions(f?f.variety:'')+'</select></label>'+
    '<div id="newVarBox" style="display:none"><div class="g2">'+
      '<label class="fld"><span>Nombre de la variedad nueva</span><input id="fVarNew" autocomplete="off"></label>'+
      '<label class="fld"><span>Tipo</span><select id="fVarType"><option value="naranja">Naranja</option><option value="mandarina">Mandarina</option><option value="otra">Otra</option></select></label>'+
    '</div><div class="note" style="margin-top:-4px">Se guardará en la lista para las próximas fincas.</div></div>'+
    '<div class="row wrap2"><button class="btn" data-act="save-finca" data-id="'+(f?f.id:'')+'">Guardar finca</button>'+
    '<button class="btn ghost" data-act="close">Cancelar</button><span class="spacer"></span>'+
    (f?'<button class="btn danger" data-act="del-finca" data-id="'+f.id+'">Borrar finca</button>':'')+'</div>');
  setTimeout(()=>{const i=$('fName');if(i)i.focus()},50);
}

function recForm(r){
  const x=r||{fecha:today(),mat:'',ce:'',pe:'',tara:'',bruto:'',cs:'',ps:''};
  const v=k=>x[k]===undefined||x[k]===0&&!r?'':x[k];
  const inp=(id,label,val)=>'<label class="fld"><span>'+label+'</span><input id="'+id+'" inputmode="decimal" autocomplete="off" value="'+esc(val==null?'':val)+'"></label>';
  openSheet('<h2>'+(r?'Editar registro':'Nuevo registro')+'</h2>'+
    '<div class="g2"><label class="fld"><span>Fecha</span><input type="date" id="rFecha" value="'+esc(x.fecha)+'"></label>'+
    '<label class="fld"><span>Matrícula</span><input id="rMat" list="platesList" autocapitalize="characters" autocomplete="off" value="'+esc(x.mat)+'"></label></div>'+
    '<datalist id="platesList">'+S.plates.map(p=>'<option value="'+esc(p)+'">').join('')+'</datalist>'+
    '<div class="grp">Entrada</div><div class="g2">'+inp('rCe','Cajas entrada',v('ce'))+inp('rPe','Palet entrada',v('pe'))+'</div>'+
    '<div class="grp">Pesada (kg)</div><div class="g2">'+inp('rTara','Tara',v('tara'))+inp('rBruto','Bruto',v('bruto'))+'</div>'+
    '<div class="grp">Salida</div><div class="g2">'+inp('rCs','Cajas salida',v('cs'))+inp('rPs','Palet salida',v('ps'))+'</div>'+
    '<label class="fld"><span>Observaciones</span><textarea id="rObs" style="min-height:76px;font-family:inherit;font-size:16px">'+esc(x.obs||'')+'</textarea></label>'+
    '<div class="prev" id="prev"></div>'+
    '<div class="row wrap2"><button class="btn" data-act="save-rec" data-id="'+(r?r.id:'')+'">Guardar registro</button>'+
    '<button class="btn ghost" data-act="close">Cancelar</button><span class="spacer"></span>'+
    (r?'<button class="btn danger" id="delRec" data-act="del-rec" data-id="'+r.id+'">Borrar</button>':'')+'</div>');
  updatePreview();
}
function readRec(){
  return {fecha:$('rFecha').value,mat:$('rMat').value.trim().toUpperCase(),ce:num($('rCe').value),pe:num($('rPe').value),
    tara:num($('rTara').value),bruto:num($('rBruto').value),cs:num($('rCs').value),ps:num($('rPs').value),obs:$('rObs').value.trim()};
}
function updatePreview(){
  const p=$('prev');if(!p||!$('rCe'))return;
  const r=readRec();
  p.innerHTML='<div class="st"><div class="l">Stock cajas</div><div class="v">'+fmt(stockC(r))+'</div></div>'+
    '<div class="st"><div class="l">Stock palet</div><div class="v">'+fmt(stockP(r))+'</div></div>'+
    '<div><div class="l">Peso neto kg</div><div class="v">'+fmt(neto(r),1)+'</div></div>';
}

function settings(){
  const json=JSON.stringify(S);
  openSheet('<h2>Ajustes</h2>'+
    '<div class="grp">Campañas</div>'+
    '<div class="row wrap2" style="margin-bottom:6px"><input id="newCamp" class="camp" style="flex:1;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px" placeholder="Ej. Campaña 2027/28" autocomplete="off">'+
    '<button class="btn" data-act="add-camp">Crear campaña</button></div>'+
    '<div class="grp">Matrículas guardadas</div>'+
    (S.plates.length?'<div class="plates">'+S.plates.map((p,i)=>'<span class="chip">'+esc(p)+'<button data-act="del-plate" data-i="'+i+'" aria-label="Quitar '+esc(p)+'">×</button></span>').join('')+'</div>':'<div class="note">Se guardan solas al registrar una matrícula.</div>')+
    '<div class="grp">Copia de seguridad en Excel</div>'+
    '<div class="note">'+(S.lastBackup?'Última copia: '+showDate(S.lastBackup)+'.':'Todavía no has hecho ninguna copia.')+' La app te lo recuerda cada día al abrirla.</div>'+
    '<div class="row wrap2" style="margin-bottom:6px"><button class="btn" data-act="excel">Hacer copia (Excel)</button><button class="btn ghost" data-act="pick-xlsx">Restaurar desde Excel</button></div>'+
    '<div class="grp">Copia en texto (opcional)</div>'+
    '<div class="note">Los datos se guardan solos en este móvil. Esta copia en texto sirve para pasarlos a otro dispositivo o como respaldo: para restaurar, pégala aquí.</div>'+
    '<label class="fld"><textarea id="backup">'+esc(json)+'</textarea></label>'+
    '<div class="row wrap2"><button class="btn ghost" data-act="copy-backup">Copiar</button><button class="btn ghost" data-act="restore">Restaurar desde el texto</button><span class="spacer"></span><button class="btn" data-act="close">Cerrar</button></div>');
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='shade'){if(e.target===t)closeSheet();return}
  if(a==='close'){closeSheet();return}
  if(a==='tab-home'){SEL={on:false,ids:{}};V={name:'home',id:null};render();window.scrollTo(0,0);return}
  if(a==='tab-kilos'){V={name:'summary',mode:'kilos',id:null};render();window.scrollTo(0,0);return}
  if(a==='tab-envases'){V={name:'summary',mode:'envases',id:null};render();window.scrollTo(0,0);return}
  if(a==='back'){const ff=V.id?finca(V.id):null;V={name:ff&&ff.done?'done':'home',id:null};render();return}
  if(a==='tab-done'){SEL={on:false,ids:{}};V={name:'done',id:null};render();window.scrollTo(0,0);return}
  if(a==='sel-toggle'){SEL={on:true,ids:{}};render();return}
  if(a==='sel-cancel'){SEL={on:false,ids:{}};render();return}
  if(a==='sel-none'){SEL.ids={};render();return}
  if(a==='sel-all'){
    const lst=camp().fincas.filter(f=>V.name==='done'?f.done:!f.done);
    SEL.ids={};lst.forEach(f=>{SEL.ids[f.id]=true});render();return;
  }
  if(a==='toggle-sel'){SEL.ids[t.dataset.id]=!SEL.ids[t.dataset.id];render();return}
  if(a==='sel-pdf'){
    if(!selCount())return;
    openSheet('<h2>PDF de '+selCount()+(selCount()===1?' finca':' fincas')+'</h2>'+
      '<label class="fld"><span>Contenido</span><select id="selDet"><option value="1">Resumen + registros de cada finca</option><option value="0">Solo el resumen de las fincas</option></select></label>'+
      '<div class="note">Se genera un único PDF y se abre la hoja de compartir una sola vez.</div>'+
      '<div class="row wrap2"><button class="btn" data-act="do-sel-pdf">Generar PDF</button><button class="btn ghost" data-act="close">Cancelar</button></div>');
    return;
  }
  if(a==='do-sel-pdf'){
    const det=$('selDet').value==='1';
    const lst=camp().fincas.filter(f=>SEL.ids[f.id]);
    closeSheet();pdfFincas(lst,det);return;
  }
  if(a==='end-finca'){
    const key='end'+t.dataset.id;
    if(delArm!==key){
      delArm=key;const old=t.textContent;t.textContent='¿Cerrar la recolección de esta finca? Toca otra vez';
      setTimeout(function(){if(delArm===key&&t.isConnected){delArm=false;t.textContent=old}},4000);
      return;
    }
    const f=finca(t.dataset.id);delArm=false;
    if(f){f.done=true;f.doneDate=today();save()}
    V={name:'done',id:null};render();window.scrollTo(0,0);return;
  }
  if(a==='reopen-finca'){
    const f=finca(t.dataset.id);
    if(f){f.done=false;f.doneDate='';save()}
    V={name:'home',id:null};render();window.scrollTo(0,0);return;
  }
  if(a==='settings'){settings();return}
  if(a==='excel'){exportXlsx();return}
  if(a==='pdf-summary'){F.modo=V.mode==='envases'?'envases':'kilos';listingSheet();return}
  if(a==='do-pdf-summary'){readListing();if(!filtered().length){updateListing();return}closeSheet();pdfSummary();return}
  if(a==='pdf-finca'){pdfFinca();return}
  if(a==='new-finca'){fincaForm(null);return}
  if(a==='open-finca'){V={name:'finca',id:t.dataset.id};render();window.scrollTo(0,0);return}
  if(a==='edit-finca'){fincaForm(finca(V.id));return}
  if(a==='save-finca'){
    const name=$('fName').value.trim();if(!name){$('fName').focus();return}
    let variety=$('fVarSel').value;
    if(variety==='__new__'){
      const nn=$('fVarNew').value.trim();
      if(!nn){$('fVarNew').focus();return}
      variety=canonicalVariety(nn);
      registerVariety(variety,$('fVarType').value);
    }
    const owner=$('fOwner').value.trim();
    if(t.dataset.id){const f=finca(t.dataset.id);f.name=name;f.variety=variety;f.owner=owner}
    else camp().fincas.push({id:uid(),name:name,owner:owner,variety:variety,ord:Date.now(),records:[]});
    save();closeSheet();render();return;
  }
  if(a==='del-finca'){
    if(!delArm){delArm=true;t.textContent='Toca otra vez para borrar';return}
    const c=camp();c.fincas=c.fincas.filter(f=>f.id!==t.dataset.id);
    save();closeSheet();V={name:'home',id:null};render();return;
  }
  if(a==='new-rec'){recForm(null);return}
  if(a==='edit-rec'){const f=finca(V.id);recForm(f.records.find(r=>r.id===t.dataset.id));return}
  if(a==='save-rec'){
    const r=readRec();if(!r.fecha){$('rFecha').focus();return}
    const f=finca(V.id);
    if(t.dataset.id){const o=f.records.find(q=>q.id===t.dataset.id);Object.assign(o,r)}
    else{r.id=uid();r.ts=Date.now();f.records.push(r)}
    if(r.mat&&S.plates.indexOf(r.mat)<0){S.plates.push(r.mat);S.plates.sort()}
    save();closeSheet();render();return;
  }
  if(a==='del-rec'){
    if(delArm!==t.dataset.id){
      delArm=t.dataset.id;const old=t.textContent;t.textContent='¿Seguro? Toca otra vez';
      setTimeout(function(){if(delArm===t.dataset.id&&t.isConnected){delArm=false;t.textContent=old}},4000);
      return;
    }
    const f=finca(V.id);f.records=f.records.filter(r=>r.id!==t.dataset.id);
    save();closeSheet();render();return;
  }
  if(a==='add-camp'){
    const n=$('newCamp').value.trim();if(!n){$('newCamp').focus();return}
    const c={id:uid(),name:n,fincas:[]};S.campaigns.push(c);S.current=c.id;
    save();closeSheet();V={name:'home',id:null};render();return;
  }
  if(a==='del-plate'){S.plates.splice(+t.dataset.i,1);save();settings();return}
  if(a==='excel-reminder'){closeSheet();exportXlsx();return}
  if(a==='pick-xlsx'){const fi=$('xlsxIn');if(fi)fi.click();return}
  if(a==='import-ok'){applyImport();return}
  if(a==='copy-backup'){
    const ta=$('backup');ta.select();
    try{navigator.clipboard.writeText(ta.value);t.textContent='Copiado'}catch(err){try{document.execCommand('copy');t.textContent='Copiado'}catch(e2){}}
    return;
  }
  if(a==='restore'){
    try{
      const txt=$('backup').value.replace(/[\u201C\u201D\u201E]/g,'"').replace(/[\u2018\u2019]/g,"'").trim();
      const d=JSON.parse(txt);
      if(!d||!Array.isArray(d.campaigns))throw new Error('x');
      localStorage.setItem(KEY,JSON.stringify(d));
      load();save();closeSheet();V={name:'home',id:null};render();
    }catch(err){t.textContent='Texto no válido'}
    return;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id&&/^r(Ce|Pe|Tara|Bruto|Cs|Ps)$/.test(e.target.id))updatePreview();
  if(e.target.id==='lPat')updateListing();
});
document.addEventListener('change',function(e){
  if(e.target.id==='campSel'){S.current=e.target.value;F.variedad='';F.patron='';SEL={on:false,ids:{}};save();render()}
  else if(e.target.id==='lVar'||e.target.id==='lModo'){updateListing()}
  else if(e.target.id==='xlsxIn'){const fl=e.target.files&&e.target.files[0];e.target.value='';importFile(fl)}
  else if(e.target.id==='fVarSel'){
    const box=$('newVarBox');box.style.display=e.target.value==='__new__'?'block':'none';
    if(e.target.value==='__new__')setTimeout(function(){$('fVarNew').focus()},30);
  }
});

load();render();save();startupReminder();
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
setInterval(save,5*60*1000);
})();
</script>
